<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Agri Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE work, run like a holographic ops console (the user asked for Jarvis style)
   IDEA a HUD command centre: each business unit is a node on a glowing ring
   PICTURE home: the reactor ring with nine unit nodes; unit page: a marker sketch of the path on a whiteboard
   COLOUR night console #04101c, cyan #3be3ff glow, status green/blue/coral; whiteboard white with marker inks
   TYPE Rajdhani for HUD titles, Inter for text, Caveat for marker handwriting
   LAYOUT home: title + unit grid left, ring right; phone: title, ring, grid. Unit page: header, two panels, competitors, value chain, whiteboard, cards */
:root{color-scheme:dark;--bg:#04101c;--panel:#0a1c2e;--panel2:#0d2439;--line:rgba(59,227,255,.22);--cy:#3be3ff;--ink:#e6f6ff;--mut:#93b6cc;--ok:#4ef0a0;--act:#3be3ff;--res:#a9c8ff;--idea:#ff8f7a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;background-image:radial-gradient(circle at 80% -10%,rgba(59,227,255,.13),transparent 55%),linear-gradient(rgba(59,227,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(59,227,255,.035) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
a{color:inherit}
h1,h2,h3{font-family:Rajdhani,Inter,sans-serif;font-weight:700;line-height:1.05;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(34px,5vw,52px);text-wrap:balance}
h2{font-size:26px;color:var(--cy);margin-bottom:14px}
h3{font-size:20px}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,3.5vw,48px) max(4vw,16px)}
.mut{color:var(--mut)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 0 0 1px rgba(59,227,255,.04) inset,0 0 28px rgba(59,227,255,.06)}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 13px/1 Inter,sans-serif;padding:6px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.s-ok{color:var(--ok)}.s-act{color:var(--act)}.s-res{color:var(--res)}.s-idea{color:var(--idea)}
/* home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center}
.lede{font-size:17px;color:var(--mut);max-width:58ch;margin:14px 0 22px}
.units{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.unit{display:flex;flex-direction:column;gap:8px;text-decoration:none;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,28,46,.85);min-height:118px;transition:border-color .2s,box-shadow .2s,transform .2s}
.unit:hover,.unit:focus-visible{border-color:var(--cy);box-shadow:0 0 22px rgba(59,227,255,.28);transform:translateY(-2px);outline:none}
.unit b{font:700 19px/1.1 Rajdhani,sans-serif}
.unit span.d{font-size:13.5px;color:var(--mut);line-height:1.35}
.unit .chip{align-self:flex-start;margin-top:auto;font-size:12px;padding:5px 8px}
.ring{position:relative;aspect-ratio:1;width:100%;max-width:520px;justify-self:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring a text{font:600 13px Rajdhani,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.ring a:hover circle.n,.ring a:focus circle.n{fill:var(--cy)}
.spin{transform-origin:50% 50%;animation:spin 60s linear infinite}
.spin2{transform-origin:50% 50%;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin,.spin2{animation:none}.unit{transition:none}}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
.foot{margin-top:28px;font-size:13px;color:var(--mut)}
/* unit page */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover,.btn:focus-visible{border-color:var(--cy);outline:none;box-shadow:0 0 14px rgba(59,227,255,.25)}
.hd{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.hd p{margin:8px 0 0;color:var(--mut);font-size:17px;max-width:70ch}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.panel p{margin:0}
ul.st{margin:0;padding:0;list-style:none;display:grid;gap:10px}
ul.st li{position:relative;padding-left:20px}
ul.st li::before{content:"";position:absolute;left:2px;top:.6em;width:8px;height:8px;border:2px solid var(--cy);transform:rotate(45deg)}
.src{margin-top:14px;font-size:13px;color:var(--mut)}
.comp{display:grid;gap:10px}
.co{display:grid;grid-template-columns:minmax(0,1fr);padding:10px 12px;border-radius:10px;background:rgba(4,16,28,.55);border:1px solid rgba(59,227,255,.1)}
.co b{font-weight:600}.co span{font-size:14px;color:var(--mut)}
.flag{font:700 15px Rajdhani,sans-serif;color:var(--cy);margin-bottom:8px;display:block}
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;counter-reset:s}
.stg{position:relative;padding:14px;border-radius:12px;background:rgba(4,16,28,.6);border:1px solid var(--line)}
.stg:not(:last-child)::after{content:"";position:absolute;right:-9px;top:26px;width:8px;height:8px;border-top:2px solid var(--cy);border-right:2px solid var(--cy);transform:rotate(45deg)}
.stg h3{font-size:17px;margin-bottom:8px}
.pl{display:flex;flex-wrap:wrap;gap:6px}
.pl i{font-style:normal;font-size:13px;padding:3px 8px;border-radius:6px;background:rgba(59,227,255,.08);border:1px solid rgba(59,227,255,.18)}
.wb{background:#f8fafb;border-radius:14px;border:10px solid #c9d3db;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.wb .fig{position:relative;min-height:340px}
.wb svg{position:absolute;inset:0;width:100%;height:100%}
.wbkey{display:flex;flex-wrap:wrap;gap:14px;padding:8px 16px 12px;font:600 18px Caveat,cursive;color:#1b1f24}
.wbkey span{display:inline-flex;align-items:center;gap:6px}
.wbkey i{width:22px;height:0;border-top:3px solid}
.cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-color:var(--cy) transparent}
.card{flex:0 0 min(300px,82%);scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,#0f2a44,#0a1c2e);color:var(--ink);font:inherit;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.02);border-color:var(--cy);box-shadow:0 0 26px rgba(59,227,255,.3);outline:none}
.card h3{font-size:21px}
.card p{margin:0;font-size:14.5px;color:var(--mut)}
.card .chip{align-self:flex-start;font-size:12px}
.card .more{margin-top:auto;font-size:13px;color:var(--cy)}
.ctl{display:flex;gap:8px}
.sec{margin-top:26px}
.sechd{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.sechd p{margin:0 0 12px;color:var(--mut);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5em,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(10,28,46,.85)}
.kpi b{display:block;font:700 clamp(24px,2.6vw,30px)/1.05 Rajdhani,sans-serif;color:var(--cy);white-space:nowrap}
.kpi span{font-size:13.5px;color:var(--mut);line-height:1.35;display:block;margin-top:4px}
.scroll{overflow-x:auto}
table.ly{width:100%;border-collapse:collapse;font-size:15px}
table.ly th{text-align:left;font:700 15px Rajdhani,sans-serif;color:var(--cy);padding:8px 10px;border-bottom:1px solid var(--line)}
table.ly td{padding:9px 10px;border-bottom:1px solid rgba(59,227,255,.1);vertical-align:top}
table.ly td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
ul.gp{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--ink)}
@media(max-width:600px){table.ly thead{display:none}table.ly tr{display:grid;padding:8px 0;border-bottom:1px solid rgba(59,227,255,.1)}table.ly td{border:0;padding:2px 0;display:flex;gap:12px;justify-content:space-between;text-align:right}table.ly td::before{content:attr(data-l);color:var(--mut);text-align:left}table.ly td.n{text-align:right}}
.why{border-color:rgba(78,240,160,.45)}
.lead{font-size:18px;line-height:1.5;margin:0 0 16px!important;color:var(--ink)}
.pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:12px}
.pt{padding:12px 14px;border-radius:10px;background:rgba(4,16,28,.55);border:1px solid rgba(78,240,160,.2)}
.pt b{display:block;font:700 17px Rajdhani,sans-serif;color:var(--ok);margin-bottom:4px}
.pt span{font-size:14.5px;color:var(--ink)}
.bars{display:grid;gap:10px}
.br{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14.5px}
.br .tr{height:16px;border-radius:4px;background:rgba(59,227,255,.08);overflow:hidden}
.br .tr i{display:block;height:100%;background:linear-gradient(90deg,#1aa7c4,var(--cy));box-shadow:0 0 10px rgba(59,227,255,.5)}
.br .tr i.g{background:linear-gradient(90deg,#2bb377,var(--ok))}
.br .tr i.m{background:rgba(147,182,204,.45);box-shadow:none}
.br em{font-style:normal;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.bld{display:grid;grid-template-columns:repeat(auto-fit,minmax(16em,1fr));gap:12px}
.bld div{padding:14px;border-radius:10px;background:rgba(4,16,28,.55);border:1px solid var(--line)}
.bld b{display:block;font:700 17px Rajdhani,sans-serif;color:var(--cy);margin-bottom:4px}
.bld span{font-size:14.5px}
@media(max-width:600px){.br{grid-template-columns:minmax(0,1fr) auto}.br .tr{grid-column:1/-1;order:3}}
.mkt{border-color:rgba(255,143,122,.5);min-height:0}
.mkt:hover,.mkt:focus-visible{border-color:var(--idea);box-shadow:0 0 22px rgba(255,143,122,.3)}
.plays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.play{padding:18px;border-radius:12px;border:1px solid var(--line);background:rgba(4,16,28,.6)}
.play h3{font-size:24px;color:var(--cy)}.play i{display:block;font-style:normal;color:var(--ok);font-weight:600;margin:6px 0 8px;font-size:14.5px}
.play p{font-size:15px}
.rec{margin:0 0 16px;padding:14px 16px;border-left:4px solid var(--ok);background:rgba(78,240,160,.07);border-radius:0 10px 10px 0;font-size:17px}
ol.srcs{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}ol.srcs a{color:var(--cy)}
@media(max-width:900px){.plays{grid-template-columns:minmax(0,1fr)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,8,14,.72);z-index:20}
.modal.on{display:flex}
.mbox{width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:16px;border:1px solid var(--cy);background:var(--panel2);box-shadow:0 0 40px rgba(59,227,255,.35)}
.mbox h3{font-size:28px;margin:12px 0 10px}
.mbox dl{margin:16px 0 0;display:grid;gap:10px}
.mbox dt{font:700 15px Rajdhani,sans-serif;color:var(--cy)}
.mbox dd{margin:0;color:var(--ink)}
@media(max-width:900px){.home{grid-template-columns:minmax(0,1fr)}.ring{max-width:420px;order:-1}.hero{order:-2}.units{grid-template-columns:repeat(2,minmax(0,1fr))}.chain{grid-auto-flow:row;grid-auto-columns:auto}.stg:not(:last-child)::after{right:auto;left:22px;top:auto;bottom:-9px;transform:rotate(135deg)}}
@media(max-width:600px){.two{grid-template-columns:minmax(0,1fr)}.units{grid-template-columns:minmax(0,1fr)}.unit{min-height:0}}
</style>
</head>
<body>

<script>
{
const ST={ok:["Operating","s-ok"],act:["In progress","s-act"],res:["Researching","s-res"],idea:["Idea stage","s-idea"]};
const V=[
{id:"farm",name:"Regenerative farm & tree crops",short:"Syntropic agroforest on a 4,200-acre certified organic estate at Rwekunya, Kiryandongo, Uganda",st:"ok",
kpi:[["4,200 ac","Certified organic estate (former maize farm)"],["2,619 ac","Set aside for the syntropic forest, ~69 blocks"],["330–335 ac","Planted so far"],["565 ac","Planted by end-2026; all 2,619 by 2031"],["800 / ac","512 biomass + 288 productive plants"],["4,078 t","Fruit and nut output a year at peak (2037)"]],
syn:"Syntropic farming, developed by Swiss farmer Ernst Götsch in Brazil, designs a farm to work like a natural forest. Many species are planted close together in layers by height (stratification) and by life span (succession), so every level of sunlight and every year of the cycle is used. Fast-growing support trees are pruned regularly and the cuttings are dropped on the ground as mulch (chop and drop). That mulch builds soil, holds water and feeds the crops in place of bought fertiliser, so the land gets more fertile each year instead of less.",
why:{lead:"Regenerative farming is what makes customers choose Soul Agri's produce over a commodity supplier, and keep coming back: buyers pay for produce they can prove is organic, deforestation-free and traceable to the plant. The same practices also earn carbon income and cut costs.",
pts:[["Access to EU buyers","From 30 Dec 2026, EU importers of coffee and cocoa must prove each lot comes from deforestation-free plots (EUDR). An agroforest planted on former maize land, with plot data and QR-tagged plants, meets that test where many smallholder lots fail."],["Organic premium","The 4,200-acre estate is certified organic. Organic and specialty buyers pay more and reorder from suppliers whose produce is residue-free and certified."],["A story buyers can check","Specialty roasters, chocolate makers and wellness brands sell provenance. Plant-level traceability and a living-forest farm give them a story they can show their own customers."],["Carbon from the same acre","Biomass, soil carbon and biochar can be certified and sold as carbon credits: a second income without more land."],["Lower costs, lower risk","Mulch, compost, biochar and microbes replace bought fertiliser, and 13 crops harvested across seasons replace a single maize crop exposed to one price and one bad season."],["Know-how to sell","A proven system lets the farm sell certified plants, inputs and SOPs to neighbouring farms, the base of the 50,000-acre outgrower plan."]]},
money:[["Fruit and nuts","13 productive species: avocado, mango, jackfruit, banana, soursop, guava, jamun, macadamia, cashew, cinnamon, moringa","4,078 t/year at peak (2037): avocado 1,157 t, jackfruit 813 t, mango 732 t; 70% processed, 30% fresh export"],["Coffee and cocoa","Robusta KR7/KR8 coffee and cocoa, ~160 plants/acre","First yield in year 3–4, peak years 7–20; 3,600 t cherry primary processing capacity"],["Essential oils","Lemongrass, rosemary, palmarosa, mint","100 kg grass per batch → ~1 L oil; 84 t grass → ~420 kg oil a year"],["Jaggery","12 of 150 acres of sugarcane","32–33 t a year; cost ₹83/kg vs price ₹263/kg; 49-month payback at full capacity"],["Powders and snacks","Moringa, beetroot, carrot, turmeric, ginger; vacuum-fried jackfruit, sweet potato, cassava","126 t a year into powders (moringa cost ₹154/kg vs ₹450–550/kg target); 25 t into vacuum frying"],["Oils and honey","Cold-pressed soybean and sunflower; 180 bee boxes","100 t seed a year; honey ~1 t now, ~5 t at 1,000 boxes"],["Nursery","Certified clonal plants","Up to ~900,000 plants a year; sales across East Africa"],["Carbon credits","Biomass, soil carbon and biochar","Not yet registered; 31 t biochar on the first block"],["Timber and tourism","Mahogany and teak; 400-acre forest parcel","Timber at ~15 years; wellness retreats, farm-to-table, nature trails"]],
land:[["Syntropic agroforest",2619,"2,619"],["Not yet allocated",660,"~650–670"],["Silvopasture (cattle)",380,"~380"],["Internal roads",290,"~280–300"],["Sugarcane",150,"150"],["Agro-processing zone",100,"100"]],
prog:[["2024 trial",10,"10"],["Scale-up",115,"115"],["2026 Season 1",335,"330–335"],["2026 Season 2",565,"565"],["2031 target",2619,"2,619"]],
layers:[["Emergent (timber)","Mahogany, teak, silky oak","~18","Timber at ~15 years"],["High canopy","Mango (~10/acre), jackfruit (~2–9/acre), cashew","~24","Mango 732 t and jackfruit 813 t a year at peak"],["Medium canopy","Avocado, macadamia, cinnamon, soursop, guava, jamun","~26–34","Avocado from year 5–6; 1,157 t a year at peak"],["Lower canopy","Coffee (~70–80) and cocoa (~60–70)","~130–160","First yield year 3–4; peak years 7–20"],["Lower canopy","Banana, moringa","~48","Banana is early cash; fades by ~2030 as shade closes"],["Chop and drop","Albizia, calliandra, Cassia siamea, leucaena, gliricidia, eucalyptus, pink trumpet","~512","First cut at ~6 months; cut back to mulch after 3–3.5 years"],["Line and inter-row","Lemongrass, rosemary, mint; palmarosa, ginger, turmeric proposed","In rows","Oils and spices from year 1"]],
build:[["Land split","2,619 acres go to the forest in ~69 blocks across Divisions A–E. Sugarcane, pasture, roads and the processing zone sit outside it."],["4-row design","Row 1 high canopy; row 2 coffee and cocoa with chop-and-drop and rosemary; row 3 timber and medium canopy; row 4 coffee and cocoa with chop-and-drop and companions. A plant every 1 m, a productive plant every 3 m, 5 m between system rows, 4 lines of 200 m per acre."],["Phased planting","10-acre trial in 2024, then 115, 330–335 and 565 acres, then ~450 acres a year. Coffee and cocoa go in ~6 months after the shade species."],["Soil without tillage","Pits or beds only, mulch for 90% ground cover, 600 t compost and 31 t biochar on the first block, 4 microbial nutrient strains every 30–45 days, biopesticides only when pests show."],["Water","58 ponds planned (20 dug), each with a 7.5 HP pump serving a 50-acre zone; drip for all 2,619 acres at over ₹14 crore."],["Own nursery","150,000 plants per cycle; self-sufficient in coffee, cocoa and fruit clones by late 2027."],["Processing on site","A 9,000 sq ft facility (~₹3 crore) so 70% of output can be sold processed."],["Tracking","Verdnt ERP block records, QR tags on all 288 productive plants per acre, a census twice a year, drones once the flight permit arrives."]],
def:"A plantation business: grow perennial tree crops, harvest, do the first processing (pulping, fermenting, drying) and sell to exporters, processors and brands. Soul Agri's version is a syntropic agroforest with 13 productive species, plus on-farm processing, nursery, carbon and tourism income from the same land.",
now:["330–335 acres planted: a 10-acre trial in 2024, 115 acres after scale-up, and 200 acres in Season 1 2026 (15 Feb–15 May), where 11 of 13 productive species went in and coffee and cocoa waited for shade.","Season 2 2026 (1 Aug–early Dec) adds 225–250 acres for 565 by year end; 240,000 plants needed, 137,000 from the own nursery; 12,000 chop-and-drop plants already in block D5.","2027 Season 1: 250 acres coffee-led, ~20,000 KR7/KR8 seedlings booked with NARO/NaCORI.","Mortality of 35–40% in the first 115-acre block, partly from 2×2 ft pits in stony hardpan; target survival is 95%.","75 permanent staff plus daily casual labour; ERP choice between FarmERP and KhetiBadi for 31 users."],
gaps:["Estate size: 4,200 acres (Jul call) vs 4,400 acres (Aug workshop). The deed or survey should settle it.","Planted area reconciled as 330–335 acres, with 35 acres the first fully established block; confirm with the field census.","About 650–670 acres are not allocated in either source (possibly the 400-acre forest parcel and idle land).","Still missing: sizes and crops for the ~69 blocks, per-acre counts and yields for most fruit and nut species, coffee and cocoa yields, livestock numbers and revenue projections."],
src:"Strategic Brainstorming Workshop (Aug 2026) and Regenerative Agroforestry & Organic Value Chain call (Jul 2026), via Gemini Notebook, 24 Nov 2026. Figures as spoken; not yet checked against farm records",
india:[["Tata Consumer Products","Coffee estates in Karnataka; plantation to brand"],["Harrisons Malayalam","Tea and rubber estates, Kerala"],["Sahyadri Farms","Farmer-owned fruit and vegetable value chain"],["Blue Tokai","Specialty roaster buying direct from estates"]],
uganda:[["Kyagalanyi Coffee (Volcafe)","Top-3 coffee exporter; runs outgrower programmes"],["Ugacof","Largest exporter by share in late 2025"],["Olam Uganda (ofi)","Coffee and cocoa sourcing"],["Clark Farm, Kyenjojo","Estate coffee, 305 t in 2025, plus farm tours"]],

kpi:[["708 LMT","Fertiliser used in India in 2024-25, 387 LMT of it urea"],["~50%","Share of India's DAP that is imported; all of its potash"],["2–3 kg/ha","Uganda's application rate vs 22 kg Africa average"],["67,130 t","Uganda's fertiliser imports in 2022 (peak 100,120 t in 2018)"],["None","Primary mineral fertiliser production in Uganda (IFDC)"],["<8%","Ugandan households that use fertiliser"]],
what:"A fertiliser is anything added to soil or plants to supply the nutrients crops need. The big three are nitrogen (N) for leaf growth, phosphorus (P) for roots and flowering, and potassium (K) for fruit quality and stress tolerance; calcium, magnesium, sulphur and micronutrients such as zinc and boron matter too. Synthetic fertilisers deliver these as concentrated salts that act within days. Organic and biological inputs supply them more slowly, by feeding soil life and building organic matter.",
dep:[["Fast, visible yield response","Nutrients act within days, and on depleted soils the jump is large: one Uganda maize trial at a medium NPK rate gave 270% more yield than no fertiliser."],["Subsidies make it cheap","India's subsidy keeps urea prices artificially low, so farmers over-apply nitrogen. Uganda gives free bags to coffee, tea and cocoa smallholders through government programmes."],["The soil-depletion treadmill","Uganda loses about 80 kg of nutrients per hectare a year to erosion and harvests. Once organic matter is gone, crops need the bag every season to hold yield."],["Habit, dealers and credit","Agro-dealers, cooperatives and input credit are built around the bag, and dealer margins depend on volume."],["Simple to use","One product, a known dose, no living organisms to keep alive or explain."]],

function wrapTxt(t,max){const w=t.split(" "),L=[];let c="";w.forEach(x=>{if((c+" "+x).trim().length>max&&c){L.push(c);c=x}else c=(c+" "+x).trim()});if(c)L.push(c);return L}
function rnd(seed){let s=seed;return()=>(s=s*16807%2147483647)/2147483647}
function sketch(fig,v){
  const svg=fig.querySelector("svg"),W=fig.clientWidth,P=v.path,vert=W<640,r=rnd(v.id.length*977+13);
  const j=a=>(r()-.5)*a;
  const line=(x1,y1,x2,y2,c,w,d)=>{const mx=(x1+x2)/2+j(8),my=(y1+y2)/2+j(8);return `<path d="M${x1+j(2)} ${y1+j(2)} Q${mx} ${my} ${x2+j(2)} ${y2+j(2)}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${d?'stroke-dasharray="7 7"':""}/>`};
  const box=(x,y,w,h,c,d)=>line(x,y,x+w,y,c,2.6,d)+line(x+w,y,x+w,y+h,c,2.6,d)+line(x+w,y+h,x,y+h,c,2.6,d)+line(x,y+h,x,y-3,c,2.6,d);
  const arrow=(x1,y1,x2,y2,c)=>{const a=Math.atan2(y2-y1,x2-x1),h=11;return line(x1,y1,x2,y2,c,2.4)+`<path d="M${x2} ${y2} L${x2-h*Math.cos(a-.45)} ${y2-h*Math.sin(a-.45)} M${x2} ${y2} L${x2-h*Math.cos(a+.45)} ${y2-h*Math.sin(a+.45)}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`};
  const col={now:"#1d5fd1",step:"#1b1f24",gate:"#d6392f",alt:"#1f9d55",end:"#1d5fd1"};
  let H,pos=[],out="";
  if(!vert){
    const cw=W/P.length,bw=Math.min(cw-34,210),chars=Math.max(10,Math.floor(bw/10.5));
    H=Math.max(360,P.reduce((m,c)=>Math.max(m,c.n.length),1)*150+90);
    P.forEach((c,i)=>{const cx=cw*i+cw/2;out+=`<text x="${cx}" y="38" text-anchor="middle" style="font:700 24px Caveat,"Comic Sans MS",cursive" fill="#5b6670">${esc(c.h)}</text>`;
      const k=c.n.length;pos[i]=c.n.map((n,m)=>{const L=wrapTxt(n[0],chars),bh=L.length*22+26,y=(H+40)/2+(m-(k-1)/2)*150-bh/2;return {x:cx-bw/2,y,w:bw,h:bh,L,k:n[1]}})});
  }else{
    const bw=Math.min(W-60,320),chars=Math.max(12,Math.floor(bw/10.5));let y=20;
    P.forEach((c,i)=>{out+=`<text x="20" y="${y+18}" style="font:700 22px Caveat,cursive" fill="#5b6670">${esc(c.h)}</text>`;y+=30;
      const k=c.n.length,w=k>1?(W-60)/2:bw;pos[i]=c.n.map((n,m)=>{const L=wrapTxt(n[0],Math.max(10,Math.floor(w/10.5))),bh=L.length*22+26,x=k>1?20+m*((W-60)/2+20):(W-bw)/2;return {x,y,w,h:bh,L,k:n[1]}});
      y+=Math.max(...pos[i].map(p=>p.h))+46});
    H=y;
  }
  fig.style.height=H+"px";
  for(let i=0;i<pos.length-1;i++)pos[i].forEach(a=>pos[i+1].forEach(b=>{const c=b.k==="alt"?"#1f9d55":"#1b1f24";
    out+=vert?arrow(a.x+a.w/2,a.y+a.h+4,b.x+b.w/2,b.y-8,c):arrow(a.x+a.w+4,a.y+a.h/2,b.x-8,b.y+b.h/2,c)}));
  pos.flat().forEach(p=>{const c=col[p.k];out+=box(p.x,p.y,p.w,p.h,c,p.k==="gate");
    if(p.k==="end")out+=box(p.x-5,p.y-5,p.w+10,p.h+10,c);
    if(p.k==="gate")out+=`<text x="${p.x+p.w-6}" y="${p.y-8}" text-anchor="end" style="font:700 18px Caveat,cursive" fill="#d6392f">kill or go?</text>`;
    out+=p.L.map((l,q)=>`<text x="${p.x+p.w/2}" y="${p.y+28+q*22}" text-anchor="middle" style="font:600 20px Caveat,"Comic Sans MS",cursive" fill="${c}">${esc(l)}</text>`).join("")});
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=out;
}

  <section class="sec"><h2>Value chain & key players</h2><div class="chain">${v.chain.map(s=>`<div class="stg"><h3>${esc(s[0])}</h3><div class="pl">${s[1].map(p=>`<i>${esc(p)}</i>`).join("")}</div></div>`).join("")}</div></section>
  <section class="sec"><h2>Players</h2><div class="two"><div class="panel"><span class="flag">India</span><div class="comp">${co(v.india)}</div></div><div class="panel"><span class="flag">Uganda & East Africa</span><div class="comp">${co(v.uganda)}</div></div></div></section>
  <section class="sec panel"><h2>Replace or collaborate?</h2><p class="rec"><b>Recommendation: do both, by segment.</b> Replace fertiliser where buyers pay for chemical-free produce; collaborate with fertiliser players where the bag already rules; and use a "less bag plus biologicals" product to move farmers across over time.</p>
  <div class="plays">${v.plays.map(x=>`<div class="play"><h3>${esc(x[0])}</h3><i>${esc(x[1])}</i><p>${esc(x[2])}</p></div>`).join("")}</div>
  <h3 style="margin:22px 0 10px;color:var(--cy)">Who to approach</h3><div class="scroll"><table class="ly"><thead><tr><th>Company</th><th>What we'd propose</th><th>Why them</th></tr></thead><tbody>${v.whom.map(r=>`<tr><td data-l="Company"><b>${esc(r[0])}</b></td><td data-l="Proposal">${esc(r[1])}</td><td data-l="Why">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="sec"><h2>Possible path</h2><div class="wb"><div class="fig" id="fig"><svg aria-label="Whiteboard sketch of the fertiliser strategy path"></svg></div>
  <div class="wbkey"><span><i style="border-color:#1b1f24"></i>main path</span><span><i style="border-color:#1f9d55"></i>alternative</span><span><i style="border-color:#d6392f;border-top-style:dashed"></i>decision gate</span><span><i style="border-color:#1d5fd1"></i>start and target</span></div></div></section>
  <section class="sec"><div class="sechd"><h2>Ideas & other business models</h2><div class="ctl"><button class="btn" id="cp" aria-label="Previous cards">◂</button><button class="btn" id="cn" aria-label="Next cards">▸</button></div></div>
  <div class="cards" id="cards" tabindex="0">${v.ideas.map((d,k)=>`<button class="card" data-k="${k}"><span class="chip ${d[0]==="x"?"s-act":"s-idea"}">${d[0]==="x"?"Exploring now":"Other model"}</span><h3>${esc(d[1])}</h3><p>${esc(d[2])}</p><span class="more">Open card ▸</span></button>`).join("")}</div></section>
  <section class="sec panel"><h2>Sources</h2><ol class="srcs">${v.src.map(x=>`<li><a href="${esc(x[1])}">${esc(x[0])}</a></li>`).join("")}</ol><p class="src">Recommendations and Soul Agri positions are our analysis, to be tested in field trials.</p></section></div>`;
  document.title="Fertiliser landscape · Command Centre";
  const fig=document.getElementById("fig");ro&&ro.disconnect();ro=new ResizeObserver(()=>sketch(fig,v));ro.observe(fig);
  const cards=document.getElementById("cards"),step=()=>cards.querySelector(".card").offsetWidth+14;
  document.getElementById("cp").onclick=()=>cards.scrollBy({left:-step(),behavior:"smooth"});
  document.getElementById("cn").onclick=()=>cards.scrollBy({left:step(),behavior:"smooth"});
  cards.querySelectorAll(".card").forEach(b=>b.onclick=()=>openCard(v,v.ideas[+b.dataset.k],b));
  window.scrollTo(0,0)}
function route(){modal.classList.remove("on");ro&&ro.disconnect();const id=location.hash.slice(1),v=V.find(x=>x.id===id);id==="fertiliser"?fert():v?unit(v):home()}
window.addEventListener("hashchange",route);route();
}
